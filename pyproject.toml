[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-reverse-studio"
version = "1.0.0"
description = "Video Reverse Studio — estúdio pessoal local (CPU) dirigido por agente"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.18,<1",
  "pillow>=10,<14",
  "numpy>=1.26,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
# Voz local (Piper, CPU). Os modelos de voz NÃO são baixados pela instalação.
voice = ["piper-tts>=1.2,<2"]
# ASR leve local (faster-whisper int8). Pesos NÃO são baixados automaticamente.
asr = ["faster-whisper>=1,<2"]
# Servidor MCP stdio para agentes externos.
mcp = ["mcp>=1.2,<2"]
# Importação de links públicos (sem login, sem DRM).
links = ["yt-dlp>=2025.1"]
cutout = ["rembg>=2.0.50,<3"]
dev = ["pytest>=8,<10"]

[project.scripts]
vrs = "vrs.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["vrs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
